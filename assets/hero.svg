<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Gaurav Thakur — Systems in Motion</title>
  <desc id="desc">Gaurav Thakur, backend engineering, distributed systems, and open source. A quiet network of connected services carries moving signal pulses.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="0.7"><stop stop-color="#0a1019"/><stop offset=".62" stop-color="#101d2c"/><stop offset="1" stop-color="#10283a"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#2dd4bf" stop-opacity=".24"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <linearGradient id="signal" x2="1" y2="0"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-opacity=".055"/></pattern>
    <clipPath id="right"><rect x="735" y="0" width="465" height="320"/></clipPath>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect x="735" width="465" height="320" fill="url(#grid)" clip-path="url(#right)"/>
  <circle cx="985" cy="155" r="225" fill="url(#glow)"/>
  <path d="M0 319H1200" stroke="url(#signal)" stroke-opacity=".75" stroke-width="2"/>
  <path d="M60 46h36" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
  <text x="109" y="53" fill="#8fb7c9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="3">SYSTEMS IN MOTION</text>
  <text x="58" y="147" fill="#f2f8fc" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="800" letter-spacing="2">GAURAV</text>
  <text x="58" y="229" fill="#f2f8fc" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="800" letter-spacing="2">THAKUR</text>
  <text x="62" y="276" fill="#80d9d0" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="500">Backend Engineering  ·  Distributed Systems  ·  Open Source</text>
  <g clip-path="url(#right)" fill="none" stroke="#5db5cb" stroke-width="1.4" stroke-opacity=".36">
    <path d="M790 153L916 153L1040 84L1130 135"/>
    <path d="M916 153L1046 231L1130 135"/>
    <path d="M1040 84L1046 231"/>
    <path d="M790 153L849 81L1040 84" stroke-opacity=".17"/>
    <path d="M790 153L854 241L1046 231" stroke-opacity=".17"/>
  </g>
  <g fill="#122c3d" stroke="#5eead4" stroke-width="1.5">
    <circle cx="790" cy="153" r="11"/>
    <circle cx="916" cy="153" r="15"/>
    <circle cx="1040" cy="84" r="12"/>
    <circle cx="1046" cy="231" r="12"/>
    <circle cx="1130" cy="135" r="10"/>
  </g>
  <g fill="#8be7dd"><circle cx="790" cy="153" r="3"/><circle cx="916" cy="153" r="4"/><circle cx="1040" cy="84" r="3"/><circle cx="1046" cy="231" r="3"/><circle cx="1130" cy="135" r="3"/></g>
  <g fill="#91b6c7" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">
    <text x="879" y="190">API</text><text x="1009" y="52">EVENTS</text><text x="1020" y="265">DATA</text><text x="1097" y="172">EDGE</text>
  </g>
  <g fill="#5eead4" class="motion">
    <circle r="4" opacity="0"><animateMotion path="M790 153 L916 153 L1040 84" dur="7s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle r="3" opacity="0"><animateMotion path="M916 153 L1046 231 L1130 135" dur="8s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="8s" begin="2s" repeatCount="indefinite"/></circle>
  </g>
  <style>@media (prefers-reduced-motion: reduce) {.motion {display:none}}</style>
</svg>

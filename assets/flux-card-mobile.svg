<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="title desc"><title id="title">FLUX — Real-time ride booking</title><desc id="desc">Architecture motif: RIDER to BIDS to STATE to MAPS</desc><defs>
      <linearGradient id="surface" x2="1" y2="0.5"><stop stop-color="#0a1420"/><stop offset=".6" stop-color="#102233"/><stop offset="1" stop-color="#102a3a"/></linearGradient>
      <radialGradient id="glow"><stop stop-color="#7dbbff" stop-opacity=".16"/><stop offset="1" stop-color="#7dbbff" stop-opacity="0"/></radialGradient>
      <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#91bbce" stroke-opacity=".055"/></pattern>
    </defs>
    <rect width="720" height="290" rx="20" fill="url(#surface)"/>
    <rect x="0" y="0" width="5" height="290" rx="2" fill="#7dbbff"/>
    <rect width="720" height="290" rx="20" fill="url(#grid)"/>
    <circle cx="520" cy="205" r="220" fill="url(#glow)"/>
    <g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="39" y="48" fill="#7dbbff" font-size="17" font-weight="700" letter-spacing="2.5">02 / FEATURED SYSTEM</text>
        <text x="38" y="126" fill="#f4f9fc" font-size="60" font-weight="800" letter-spacing="1">FLUX</text>
        <text x="40" y="170" fill="#b5cbd6" font-size="27">Real-time ride booking</text></g><path d="M76 238H635" fill="none" stroke="#7dbbff" stroke-opacity=".42" stroke-width="2"/><circle cx="76" cy="238" r="12" fill="#112e3d" stroke="#7dbbff" stroke-width="2"/><circle cx="76" cy="238" r="3" fill="#7dbbff"/><text x="76" y="278" text-anchor="middle" fill="#9fbac8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.1">RIDER</text><circle cx="258" cy="238" r="12" fill="#112e3d" stroke="#7dbbff" stroke-width="2"/><circle cx="258" cy="238" r="3" fill="#7dbbff"/><text x="258" y="278" text-anchor="middle" fill="#9fbac8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.1">BIDS</text><circle cx="450" cy="238" r="12" fill="#112e3d" stroke="#7dbbff" stroke-width="2"/><circle cx="450" cy="238" r="3" fill="#7dbbff"/><text x="450" y="278" text-anchor="middle" fill="#9fbac8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.1">STATE</text><circle cx="635" cy="238" r="12" fill="#112e3d" stroke="#7dbbff" stroke-width="2"/><circle cx="635" cy="238" r="3" fill="#7dbbff"/><text x="635" y="278" text-anchor="middle" fill="#9fbac8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.1">MAPS</text><g class="motion" fill="#7dbbff"><circle r="4" opacity="0"><animateMotion path="M76 238H635" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="8s" repeatCount="indefinite"/></circle></g>
      <style>@media (prefers-reduced-motion: reduce){.motion{display:none}}</style></svg>

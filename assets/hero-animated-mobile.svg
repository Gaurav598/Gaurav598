<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="title desc"><title id="title">Gaurav Thakur — Systems in Motion</title><desc id="desc">Backend engineering, distributed systems, and open source. A connected service graph carries quiet signal pulses.</desc><defs>
      <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#080e19"/><stop offset=".58" stop-color="#0d1b2c"/><stop offset="1" stop-color="#102b3c"/></linearGradient>
      <linearGradient id="accent" x2="1" y2="0"><stop stop-color="#69e6d7"/><stop offset="1" stop-color="#64a8f5"/></linearGradient>
      <radialGradient id="ambient"><stop stop-color="#1da8bd" stop-opacity=".2"/><stop offset="1" stop-color="#1da8bd" stop-opacity="0"/></radialGradient>
      <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#8abbd1" stroke-opacity=".07"/></pattern>
      <clipPath id="frame"><rect width="720" height="540" rx="24"/></clipPath>
    </defs>
    <rect width="720" height="540" rx="24" fill="url(#surface)"/>
    <g clip-path="url(#frame)"><rect width="720" height="540" fill="url(#grid)"/>
      <circle cx="500" cy="435" r="230" fill="url(#ambient)"/>
      <path d="M0 538H720" stroke="url(#accent)" stroke-opacity=".55" stroke-width="2"/>
    </g><g font-family="Inter,Segoe UI,Arial,sans-serif">
          <rect x="37" y="35" width="48" height="39" rx="11" fill="#102c3d" stroke="#69e6d7" stroke-opacity=".65"/>
          <text x="49" y="62" fill="#9df3e9" font-size="19" font-weight="800">G.</text>
          <text x="102" y="61" fill="#a3c1ce" font-size="16" font-weight="700" letter-spacing="3">SYSTEMS IN MOTION</text>
          <text x="37" y="178" fill="#f3f8fb" font-size="91" font-weight="800" letter-spacing="1">GAURAV</text>
          <text x="37" y="273" fill="#f3f8fb" font-size="91" font-weight="800" letter-spacing="1">THAKUR</text>
          <text x="40" y="331" fill="#9ce4df" font-size="29">Backend Engineering · Distributed Systems</text>
          <text x="40" y="367" fill="#9ce4df" font-size="29">Open Source</text>
        </g>
        <path d="M84 458L226 458L345 418L482 463L633 420M226 458L345 503L482 463" fill="none" stroke="#6bb7ca" stroke-opacity=".4" stroke-width="2"/>
        <g fill="#102d3e" stroke="#72dfd4" stroke-width="2"><circle cx="84" cy="458" r="10"/><circle cx="226" cy="458" r="13"/><circle cx="345" cy="418" r="12"/><circle cx="345" cy="503" r="12"/><circle cx="482" cy="463" r="13"/><circle cx="633" cy="420" r="10"/></g>
        <g fill="#a9f6ea"><circle cx="84" cy="458" r="3"/><circle cx="226" cy="458" r="3"/><circle cx="345" cy="418" r="3"/><circle cx="345" cy="503" r="3"/><circle cx="482" cy="463" r="3"/><circle cx="633" cy="420" r="3"/></g>
        <g class="motion" fill="#8bf4e2"><circle r="4" opacity="0"><animateMotion path="M84 458L226 458L345 418L482 463L633 420" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="9s" repeatCount="indefinite"/></circle></g><style>@media (prefers-reduced-motion: reduce){.motion{display:none}}</style></svg>

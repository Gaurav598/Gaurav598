<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc"><title id="title">NEURASWE — AI software engineering agent</title><desc id="desc">Architecture motif: ISSUE to AGENT to TEST to PR</desc><defs>
      <linearGradient id="surface" x2="1" y2="0.5"><stop stop-color="#0a1420"/><stop offset=".6" stop-color="#102233"/><stop offset="1" stop-color="#102a3a"/></linearGradient>
      <radialGradient id="glow"><stop stop-color="#9bbcff" stop-opacity=".16"/><stop offset="1" stop-color="#9bbcff" stop-opacity="0"/></radialGradient>
      <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#91bbce" stroke-opacity=".055"/></pattern>
    </defs>
    <rect width="1200" height="230" rx="20" fill="url(#surface)"/>
    <rect x="0" y="0" width="5" height="230" rx="2" fill="#9bbcff"/>
    <rect width="1200" height="230" rx="20" fill="url(#grid)"/>
    <circle cx="1025" cy="105" r="220" fill="url(#glow)"/>
    <g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="49" y="51" fill="#9bbcff" font-size="15" font-weight="700" letter-spacing="2.7">04 / FEATURED SYSTEM</text>
        <text x="47" y="137" fill="#f4f9fc" font-size="67" font-weight="800" letter-spacing="1">NEURASWE</text>
        <text x="51" y="181" fill="#b5cbd6" font-size="25">AI software engineering agent</text></g><path d="M755 108H1133" fill="none" stroke="#9bbcff" stroke-opacity=".42" stroke-width="2"/><circle cx="755" cy="108" r="11" fill="#112e3d" stroke="#9bbcff" stroke-width="2"/><circle cx="755" cy="108" r="3" fill="#9bbcff"/><text x="755" y="154" text-anchor="middle" fill="#9fbac8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.1">ISSUE</text><circle cx="881" cy="108" r="11" fill="#112e3d" stroke="#9bbcff" stroke-width="2"/><circle cx="881" cy="108" r="3" fill="#9bbcff"/><text x="881" y="154" text-anchor="middle" fill="#9fbac8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.1">AGENT</text><circle cx="1007" cy="108" r="11" fill="#112e3d" stroke="#9bbcff" stroke-width="2"/><circle cx="1007" cy="108" r="3" fill="#9bbcff"/><text x="1007" y="154" text-anchor="middle" fill="#9fbac8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.1">TEST</text><circle cx="1133" cy="108" r="11" fill="#112e3d" stroke="#9bbcff" stroke-width="2"/><circle cx="1133" cy="108" r="3" fill="#9bbcff"/><text x="1133" y="154" text-anchor="middle" fill="#9fbac8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.1">PR</text><g class="motion" fill="#9bbcff"><circle r="4" opacity="0"><animateMotion path="M755 108H1133" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="8s" repeatCount="indefinite"/></circle></g>
      <style>@media (prefers-reduced-motion: reduce){.motion{display:none}}</style></svg>
